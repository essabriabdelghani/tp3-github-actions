name: Premier workflow CI

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions"

      - name: Afficher les informations du runner
        run: |
          echo "=== Version de Python ==="
          python3 --version
          echo "=== Repertoire courant ==="
          pwd
          echo "=== Liste des fichiers ==="
          ls -la

      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Événement : $GITHUB_EVENT_NAME"

      - name: Etape qui echoue volontairement
        run: exit 1

      - name: Etape apres l'echec
        run: echo "Cette etape ne sera pas executee"